<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Encoder & Decoder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f6fb;
      font-family: Arial, sans-serif;
      color: #172033;
    }

    .container {
      max-width: 750px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      padding: 11px 16px;
      margin: 10px 5px 5px 0;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 18px;
      padding: 15px;
      min-height: 100px;
      background: #111827;
      color: white;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: monospace;
    }

    .error {
      background: #fef2f2;
      color: #dc2626;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔗 URL Encoder & Decoder</h1>

  <p>
    Enter text or a URL and encode it or decode it.
  </p>

  <textarea
    id="inputText"
    placeholder="Enter text or URL here..."
  ></textarea>

  <br>

  <button onclick="encodeURL()">
    🔒 Encode URL
  </button>

  <button onclick="decodeURL()">
    🔓 Decode URL
  </button>

  <button onclick="copyResult()">
    📋 Copy Result
  </button>

  <button onclick="clearAll()">
    🗑️ Clear
  </button>

  <div id="result" class="result">
    Result will appear here...
  </div>

</div>

<script>

function encodeURL() {

  const input =
    document.getElementById("inputText").value;

  const result =
    document.getElementById("result");

  if (input === "") {
    result.className = "result error";
    result.textContent = "❌ Please enter some text or URL.";
    return;
  }

  try {

    const encoded =
      encodeURIComponent(input);

    result.className = "result";
    result.textContent = encoded;

  } catch (error) {

    result.className = "result error";
    result.textContent = "❌ URL encoding failed.";

  }
}


function decodeURL() {

  const input =
    document.getElementById("inputText").value;

  const result =
    document.getElementById("result");

  if (input === "") {
    result.className = "result error";
    result.textContent = "❌ Please enter encoded URL text.";
    return;
  }

  try {

    const decoded =
      decodeURIComponent(input);

    result.className = "result";
    result.textContent = decoded;

  } catch (error) {

    result.className = "result error";
    result.textContent = "❌ Invalid encoded URL.";
  }
}


function copyResult() {

  const text =
    document.getElementById("result").textContent;

  if (
    text === "Result will appear here..." ||
    text.startsWith("❌")
  ) {
    alert("❌ No valid result to copy.");
    return;
  }

  navigator.clipboard.writeText(text)
    .then(function() {
      alert("✅ Result copied!");
    })
    .catch(function() {
      alert("❌ Copy failed.");
    });
}


function clearAll() {

  document.getElementById("inputText").value = "";

  const result =
    document.getElementById("result");

  result.className = "result";

  result.textContent =
    "Result will appear here...";
}

</script>

</body>
</html>
