<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coding Super Hub - JSON Formatter</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fb;
  color:#172033;
}

header{
  background:#111827;
  color:white;
  text-align:center;
  padding:22px 10px;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:8px 0 0;
  font-size:13px;
}

.container{
  width:100%;
  max-width:800px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

textarea{
  width:100%;
  min-height:180px;
  padding:14px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-family:monospace;
  font-size:14px;
  resize:vertical;
}

button{
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  padding:11px 15px;
  margin:8px 5px 8px 0;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

.output{
  margin-top:12px;
  padding:15px;
  min-height:100px;
  border:1px solid #d5dbe5;
  border-radius:10px;
  background:#111827;
  color:white;
  white-space:pre-wrap;
  overflow:auto;
  font-family:monospace;
}

.valid{
  background:#ecfdf5;
  color:#15803d;
}

.invalid{
  background:#fef2f2;
  color:#dc2626;
}

footer{
  text-align:center;
  padding:25px;
  color:#64748b;
  font-size:13px;
}

@media(max-width:600px){
  .card{
    padding:15px;
  }

  header h1{
    font-size:21px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🚀 Coding Super Hub</h1>
  <p>Developer Tools</p>
</header>

<div class="container">

<div class="card">

<h2>📝 JSON Formatter & Validator</h2>

<p>
Paste JSON below and use the buttons to test it.
</p>

<textarea
id="jsonInput"
placeholder='{"name":"Coding Super Hub","version":1,"active":true}'
></textarea>

<div>

<button onclick="formatJSON()">
✨ Format JSON
</button>

<button onclick="validateJSON()">
✅ Validate
</button>

<button onclick="clearJSON()">
🗑️ Clear
</button>

</div>

<h3>Result</h3>

<div id="result" class="output">
Result will appear here...
</div>

</div>

</div>

<footer>
🚀 Coding Super Hub — Test 4
</footer>

<script>

function formatJSON(){

  const input =
    document.getElementById("jsonInput").value.trim();

  const result =
    document.getElementById("result");

  if(input === ""){

    result.className = "output invalid";

    result.textContent =
      "❌ Please enter JSON first.";

    return;
  }

  try{

    const parsed =
      JSON.parse(input);

    result.className = "output valid";

    result.textContent =
      JSON.stringify(parsed,null,2);

  }catch(error){

    result.className = "output invalid";

    result.textContent =
      "❌ Invalid JSON";

  }

}


function validateJSON(){

  const input =
    document.getElementById("jsonInput").value.trim();

  const result =
    document.getElementById("result");

  if(input === ""){

    result.className = "output invalid";

    result.textContent =
      "❌ Please enter JSON first.";

    return;
  }

  try{

    JSON.parse(input);

    result.className = "output valid";

    result.textContent =
      "✅ Valid JSON";

  }catch(error){

    result.className = "output invalid";

    result.textContent =
      "❌ Invalid JSON";

  }

}


function clearJSON(){

  document.getElementById("jsonInput").value = "";

  const result =
    document.getElementById("result");

  result.className = "output";

  result.textContent =
    "Result will appear here...";

}

</script>

</body>
</html>
