<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64 Encoder & Decoder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f6fb;
      font-family: Arial, sans-serif;
      color: #172033;
    }

    .container {
      max-width: 750px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      padding: 11px 16px;
      margin: 10px 5px 5px 0;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 18px;
      padding: 15px;
      min-height: 100px;
      background: #111827;
      color: white;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: monospace;
    }

    .error {
      background: #fef2f2;
      color: #dc2626;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔐 Base64 Encoder / Decoder</h1>

  <p>
    Enter text below and encode it to Base64 or decode Base64 back to text.
  </p>

  <textarea
    id="inputText"
    placeholder="Enter text here..."
  ></textarea>

  <br>

  <button onclick="encodeBase64()">
    🔒 Encode
  </button>

  <button onclick="decodeBase64()">
    🔓 Decode
  </button>

  <button onclick="copyResult()">
    📋 Copy Result
  </button>

  <button onclick="clearAll()">
    🗑️ Clear
  </button>

  <div id="result" class="result">
    Result will appear here...
  </div>

</div>

<script>

function encodeBase64() {

  const input =
    document.getElementById("inputText").value;

  const result =
    document.getElementById("result");

  if (input === "") {
    result.className = "result error";
    result.textContent = "❌ Please enter some text.";
    return;
  }

  try {

    const bytes =
      new TextEncoder().encode(input);

    let binary = "";

    bytes.forEach(function(byte) {
      binary += String.fromCharCode(byte);
    });

    const encoded =
      btoa(binary);

    result.className = "result";
    result.textContent = encoded;

  } catch (error) {

    result.className = "result error";
    result.textContent = "❌ Encoding failed.";

  }
}


function decodeBase64() {

  const input =
    document.getElementById("inputText").value.trim();

  const result =
    document.getElementById("result");

  if (input === "") {
    result.className = "result error";
    result.textContent = "❌ Please enter Base64 text.";
    return;
  }

  try {

    const binary =
      atob(input);

    const bytes =
      Uint8Array.from(
        binary,
        function(char) {
          return char.charCodeAt(0);
        }
      );

    const decoded =
      new TextDecoder().decode(bytes);

    result.className = "result";
    result.textContent = decoded;

  } catch (error) {

    result.className = "result error";
    result.textContent = "❌ Invalid Base64.";

  }
}


function copyResult() {

  const text =
    document.getElementById("result").textContent;

  if (
    text === "Result will appear here..." ||
    text.startsWith("❌")
  ) {
    alert("❌ No valid result to copy.");
    return;
  }

  navigator.clipboard.writeText(text)
    .then(function() {
      alert("✅ Result copied!");
    })
    .catch(function() {
      alert("❌ Copy failed.");
    });
}


function clearAll() {

  document.getElementById("inputText").value = "";

  const result =
    document.getElementById("result");

  result.className = "result";

  result.textContent =
    "Result will appear here...";
}

</script>

</body>
</html>
