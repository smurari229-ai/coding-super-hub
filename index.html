<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f6fb;
      font-family: Arial, sans-serif;
      color: #172033;
    }

    .container {
      max-width: 750px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    .password-box {
      width: 100%;
      min-height: 70px;
      padding: 15px;
      background: #111827;
      color: white;
      border-radius: 10px;
      font-family: monospace;
      font-size: 18px;
      word-break: break-all;
      display: flex;
      align-items: center;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    .option {
      margin: 12px 0;
    }

    .option input {
      margin-right: 8px;
    }

    button {
      padding: 11px 16px;
      margin: 12px 5px 5px 0;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔐 Password Generator</h1>

  <p>Create a random and strong password.</p>

  <div id="password" class="password-box">
    Click Generate Password
  </div>

  <label for="length">Password Length</label>

  <input
    type="number"
    id="length"
    min="4"
    max="100"
    value="16"
  >

  <div class="option">
    <label>
      <input type="checkbox" id="uppercase" checked>
      🔠 Uppercase (A-Z)
    </label>
  </div>

  <div class="option">
    <label>
      <input type="checkbox" id="lowercase" checked>
      🔡 Lowercase (a-z)
    </label>
  </div>

  <div class="option">
    <label>
      <input type="checkbox" id="numbers" checked>
      🔢 Numbers (0-9)
    </label>
  </div>

  <div class="option">
    <label>
      <input type="checkbox" id="symbols" checked>
      🔣 Symbols (!@#$)
    </label>
  </div>

  <button onclick="generatePassword()">
    🔄 Generate Password
  </button>

  <button onclick="copyPassword()">
    📋 Copy Password
  </button>

  <button onclick="clearPassword()">
    🗑️ Clear
  </button>

  <div id="message" class="message"></div>

</div>

<script>

function generatePassword() {

  const length =
    parseInt(document.getElementById("length").value);

  const useUppercase =
    document.getElementById("uppercase").checked;

  const useLowercase =
    document.getElementById("lowercase").checked;

  const useNumbers =
    document.getElementById("numbers").checked;

  const useSymbols =
    document.getElementById("symbols").checked;

  const passwordBox =
    document.getElementById("password");

  const message =
    document.getElementById("message");

  if (isNaN(length) || length < 4 || length > 100) {
    message.textContent =
      "❌ Length must be between 4 and 100.";
    return;
  }

  let characters = "";

  if (useUppercase) {
    characters += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  }

  if (useLowercase) {
    characters += "abcdefghijklmnopqrstuvwxyz";
  }

  if (useNumbers) {
    characters += "0123456789";
  }

  if (useSymbols) {
    characters += "!@#$%^&*()_+-=[]{}|;:,.<>?";
  }

  if (characters === "") {
    message.textContent =
      "❌ Select at least one character type.";
    return;
  }

  let password = "";

  for (let i = 0; i < length; i++) {

    const randomIndex =
      Math.floor(Math.random() * characters.length);

    password += characters[randomIndex];
  }

  passwordBox.textContent = password;

  message.textContent =
    "✅ Password generated!";
}


function copyPassword() {

  const password =
    document.getElementById("password").textContent;

  const message =
    document.getElementById("message");

  if (
    password === "Click Generate Password" ||
    password === ""
  ) {
    message.textContent =
      "❌ Generate a password first.";
    return;
  }

  navigator.clipboard.writeText(password)
    .then(function() {

      message.textContent =
        "✅ Password copied!";

    })
    .catch(function() {

      message.textContent =
        "❌ Copy failed.";

    });
}


function clearPassword() {

  document.getElementById("password").textContent =
    "Click Generate Password";

  document.getElementById("message").textContent =
    "";

  document.getElementById("length").value =
    16;

  document.getElementById("uppercase").checked =
    true;

  document.getElementById("lowercase").checked =
    true;

  document.getElementById("numbers").checked =
    true;

  document.getElementById("symbols").checked =
    true;
}

</script>

</body>
</html>
