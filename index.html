<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Word & Character Counter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
      color: #111827;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      padding: 15px;
      border: 1px solid #999;
      border-radius: 8px;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #2563eb;
    }

    .stats {
      margin-top: 20px;
      padding: 20px;
      background: #f8fafc;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .stat {
      font-size: 18px;
      margin: 10px 0;
    }

    .number {
      font-weight: bold;
      color: #2563eb;
    }

    button {
      margin-top: 15px;
      padding: 11px 18px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔢 Word & Character Counter</h1>

    <textarea
      id="textInput"
      placeholder="Type or paste your text here..."
    ></textarea>

    <button onclick="clearText()">🗑️ Clear</button>

    <div class="stats">

      <div class="stat">
        Words:
        <span class="number" id="wordCount">0</span>
      </div>

      <div class="stat">
        Characters:
        <span class="number" id="characterCount">0</span>
      </div>

      <div class="stat">
        Characters (without spaces):
        <span class="number" id="characterNoSpaceCount">0</span>
      </div>

      <div class="stat">
        Lines:
        <span class="number" id="lineCount">0</span>
      </div>

    </div>

  </div>

  <script>

    const textInput = document.getElementById("textInput");

    function updateCounter() {

      const text = textInput.value;

      // Character count
      const characters = text.length;

      // Character count without spaces
      const charactersWithoutSpaces =
        text.replace(/\s/g, "").length;

      // Word count
      const trimmedText = text.trim();

      const words = trimmedText === ""
        ? 0
        : trimmedText.split(/\s+/).length;

      // Line count
      const lines = text === ""
        ? 0
        : text.split("\n").length;

      document.getElementById("wordCount").textContent = words;

      document.getElementById("characterCount").textContent =
        characters;

      document.getElementById("characterNoSpaceCount").textContent =
        charactersWithoutSpaces;

      document.getElementById("lineCount").textContent =
        lines;
    }

    function clearText() {

      textInput.value = "";

      updateCounter();

      textInput.focus();
    }

    // Live counter
    textInput.addEventListener("input", updateCounter);

    // Initial count
    updateCounter();

  </script>

</body>
</html>
