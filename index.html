<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Counter Test</title>

<style>
body{
  font-family:Arial;
  background:#f3f6fb;
  padding:25px;
}

.box{
  max-width:600px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
}

textarea{
  width:100%;
  min-height:160px;
  padding:12px;
  box-sizing:border-box;
  font-size:16px;
}

.stats{
  margin-top:15px;
  padding:15px;
  background:#f8fafc;
  border:1px solid #ddd;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="box">

<h1>🔢 Word & Character Counter</h1>

<textarea
id="textInput"
placeholder="Type your text here..."
oninput="countText()"></textarea>

<div class="stats">
  <p>Words: <b id="wordCount">0</b></p>
  <p>Characters: <b id="charCount">0</b></p>
  <p>Characters (without spaces): <b id="noSpaceCount">0</b></p>
</div>

</div>

<script>

function countText(){

  const text =
    document.getElementById("textInput").value;

  const words =
    text.trim()
      ? text.trim().split(/\s+/).length
      : 0;

  const characters =
    text.length;

  const withoutSpaces =
    text.replace(/\s/g,"").length;

  document.getElementById("wordCount")
    .textContent = words;

  document.getElementById("charCount")
    .textContent = characters;

  document.getElementById("noSpaceCount")
    .textContent = withoutSpaces;
}

</script>

</body>
</html>
