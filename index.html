<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Converter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f6fb;
      font-family: Arial, sans-serif;
      color: #172033;
    }

    .container {
      max-width: 750px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 11px 16px;
      margin: 10px 5px 5px 0;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .preview {
      width: 100%;
      height: 150px;
      margin-top: 20px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
    }

    .result {
      margin-top: 18px;
      padding: 15px;
      background: #111827;
      color: white;
      border-radius: 10px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error {
      background: #fef2f2;
      color: #dc2626;
    }

    .format {
      margin-top: 12px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎨 Color Converter</h1>

  <p>
    Enter a HEX color and convert it to RGB.
  </p>

  <input
    type="text"
    id="colorInput"
    placeholder="Example: #ff0000"
  >

  <br>

  <button onclick="convertColor()">
    🎨 Convert
  </button>

  <button onclick="copyResult()">
    📋 Copy Result
  </button>

  <button onclick="clearAll()">
    🗑️ Clear
  </button>

  <div id="preview" class="preview"></div>

  <div id="result" class="result">
    Result will appear here...
  </div>

</div>

<script>

function convertColor() {

  const input =
    document.getElementById("colorInput").value.trim();

  const result =
    document.getElementById("result");

  const preview =
    document.getElementById("preview");

  if (input === "") {

    result.className = "result error";
    result.textContent =
      "❌ Please enter a HEX color.";

    return;
  }

  let hex = input;

  if (!hex.startsWith("#")) {
    hex = "#" + hex;
  }

  const hexPattern =
    /^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$/;

  if (!hexPattern.test(hex)) {

    result.className = "result error";
    result.textContent =
      "❌ Invalid HEX color. Example: #ff0000";

    preview.style.background = "#ffffff";

    return;
  }

  let fullHex = hex;

  if (hex.length === 4) {

    fullHex =
      "#" +
      hex[1] + hex[1] +
      hex[2] + hex[2] +
      hex[3] + hex[3];
  }

  const r =
    parseInt(fullHex.substring(1, 3), 16);

  const g =
    parseInt(fullHex.substring(3, 5), 16);

  const b =
    parseInt(fullHex.substring(5, 7), 16);

  const rgb =
    `rgb(${r}, ${g}, ${b})`;

  preview.style.background = fullHex;

  result.className = "result";

  result.textContent =
    "HEX: " + fullHex.toUpperCase() +
    "\nRGB: " + rgb;
}


function copyResult() {

  const text =
    document.getElementById("result").textContent;

  const result =
    document.getElementById("result");

  if (
    text === "Result will appear here..." ||
    text.startsWith("❌")
  ) {

    alert("❌ No valid result to copy.");

    return;
  }

  navigator.clipboard.writeText(text)
    .then(function() {

      alert("✅ Result copied!");

    })
    .catch(function() {

      alert("❌ Copy failed.");

    });
}


function clearAll() {

  document.getElementById("colorInput").value = "";

  document.getElementById("preview").style.background =
    "#ffffff";

  document.getElementById("result").className =
    "result";

  document.getElementById("result").textContent =
    "Result will appear here...";
}

</script>

</body>
</html>
