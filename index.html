<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Formatter Test</title>

<style>
body{
  font-family:Arial;
  background:#f3f6fb;
  padding:25px;
}

.box{
  max-width:650px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
}

textarea{
  width:100%;
  min-height:160px;
  padding:12px;
  box-sizing:border-box;
  font-size:15px;
}

button{
  padding:10px 15px;
  margin:6px 4px 6px 0;
  border:0;
  border-radius:7px;
  background:#2563eb;
  color:white;
}

#result{
  margin-top:15px;
  padding:15px;
  background:#111827;
  color:white;
  border-radius:8px;
  white-space:pre-wrap;
  min-height:80px;
}

.error{
  color:#dc2626 !important;
  background:#fff1f2 !important;
}
</style>
</head>

<body>

<div class="box">

<h1>📝 JSON Formatter</h1>

<textarea id="jsonInput"
placeholder='{"name":"Coding Super Hub","version":1}'></textarea>

<br>

<button onclick="formatJSON()">✨ Format JSON</button>
<button onclick="validateJSON()">✅ Validate</button>
<button onclick="clearJSON()">🗑️ Clear</button>

<div id="result">
Result will appear here...
</div>

</div>

<script>

function formatJSON(){

  const input =
    document.getElementById("jsonInput").value.trim();

  const result =
    document.getElementById("result");

  try{

    const parsed = JSON.parse(input);

    result.className = "";

    result.textContent =
      JSON.stringify(parsed, null, 2);

  }catch(error){

    result.className = "error";

    result.textContent =
      "❌ Invalid JSON";
  }
}


function validateJSON(){

  const input =
    document.getElementById("jsonInput").value.trim();

  const result =
    document.getElementById("result");

  try{

    JSON.parse(input);

    result.className = "";

    result.textContent =
      "✅ Valid JSON";

  }catch(error){

    result.className = "error";

    result.textContent =
      "❌ Invalid JSON";
  }
}


function clearJSON(){

  document.getElementById("jsonInput").value = "";

  document.getElementById("result").textContent =
    "Result will appear here...";

  document.getElementById("result").className = "";
}

</script>

</body>
</html>
